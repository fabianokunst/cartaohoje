# ===========================================================================
# Cartao Hoje — nginx. NAO vai na raiz do site: inclua dentro do server {}.
# As URLs limpas ja funcionam pela estrutura de diretorios.
# ===========================================================================

# --- host canonico: https + sem www ---------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name www.cartaohoje.com.br;
    return 301 https://cartaohoje.com.br$request_uri;
}

server {
    listen 80;
    server_name cartaohoje.com.br;
    return 301 https://cartaohoje.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cartaohoje.com.br;
    root /var/www/cartaohoje;
    index index.html;
    charset utf-8;

    # --- legado do WordPress ---------------------------------------------
    # Uma linha por URL antiga levantada no Search Console.
    location = /hojepay  { return 301 /hoje-pay/; }
    location ^~ /hojepay/ { return 301 /hoje-pay/; }

    # --- .html explicito -> URL limpa ------------------------------------
    location = /index.html { return 301 /; }
    location ~ ^/(.+)/index\.html$ { return 301 /$1/; }

    # --- barra final ------------------------------------------------------
    # /hoje-pay e /hoje-pay/ sao a mesma pagina; so uma pode ser canonica.
    location / {
        try_files $uri $uri/ @barra;
    }
    location @barra {
        rewrite ^([^.]*[^/])$ $1/ permanent;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- artefatos internos ----------------------------------------------
    location = /_probe.html { return 404; }
    location ~* \.(md|docx)$ { return 404; }

    # --- charset e cache --------------------------------------------------
    # Acento em llms.txt exige charset explicito.
    location ~* \.txt$ {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }
    # Nomes de arquivo estaveis: pode cachear por um ano.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # HTML sempre revalidado, para que uma correcao chegue no mesmo dia.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # --- seguranca --------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml;
}
